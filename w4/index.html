<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 - 悄悄話留言板 | 甜心開發者的冒險日誌</title>
  
  <!-- Google Fonts (甜美圓潤字型) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome (圖示庫) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ==========================================
       1. 全局變數與視覺主題控制（可在此自訂顏色與秒數）
       ========================================== */
    :root {
      /* 夢幻漸層背景 */
      --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fecfef, #a18cd1, #fbc2eb, #fad0c4);
      --card-bg: rgba(255, 255, 255, 0.82); /* 卡片半透明毛玻璃底色 */
      --text-color: #5a3d5c;                /* 主文字顏色 (深紫灰) */
      --accent-color: #ff6b81;              /* 強調色 (甜美粉紅) */
      --highlight-shadow: rgba(255, 107, 129, 0.6); /* 亮起卡片的光暈顏色 */
      
      /* 輪播秒數設定：單位為毫秒 (ms)，3000ms = 3秒 */
      --carousel-speed-ms: 3000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      min-height: 100vh;
      color: var(--text-color);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 柔和流動背景動畫 */
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 返回首頁按鈕 */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 9999px;
      color: #7e22ce;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(161, 140, 209, 0.3);
      transition: all 0.3s ease;
      z-index: 20;
    }

    .back-btn:hover {
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(161, 140, 209, 0.45);
    }

    /* 頁頭標題 */
    header {
      text-align: center;
      margin-top: 1.5rem;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.4rem;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.15);
      letter-spacing: 1px;
    }

    header p {
      color: #fff0f5;
      font-size: 1.05rem;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    /* 主容器 */
    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 10;
    }

    /* ==========================================
       2. 酷炫載入中動畫 (Loading Spinner)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 0;
    }

    .loader-heart {
      font-size: 4rem;
      color: #ff6b81;
      animation: heartbeat 1.2s infinite ease-in-out;
    }

    .loading-text {
      margin-top: 1.2rem;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
      letter-spacing: 1px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3) rotate(5deg); }
    }

    /* ==========================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-wall {
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 資料尚未讀取前先隱藏 */
    }

    /* RWD 響應式欄數設定 */
    @media (max-width: 900px) {
      .masonry-wall { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-wall { column-count: 1; }
    }

    /* ==========================================
       4. 留言卡片樣式與動態特效
       ========================================== */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 防止卡片在欄與欄之間被斷開 */
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 25px rgba(235, 160, 195, 0.2);
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    /* 卡片頭部（頭像與作者資訊） */
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffeaa7;
      color: #d63031;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.15rem;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    }

    .author-info {
      display: flex;
      flex-direction: column;
    }

    .author-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #3b203e;
    }

    .timestamp {
      font-size: 0.75rem;
      color: #7b6d7d;
    }

    /* 留言內文 */
    .card-body {
      font-size: 0.98rem;
      line-height: 1.65;
      color: #4a384e;
      white-space: pre-wrap; /* 保留換行格式 */
      word-break: break-word;
    }

    /* 可愛裝飾小圖示 */
    .card::after {
      content: '💌';
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 1.1rem;
      opacity: 0.8;
    }

    /* ------------------------------------------
       5. 輪播焦點特效（亮起 vs 變暗模糊）
       ------------------------------------------ */
    /* 被選中的焦點卡片：放大、高亮發光、取消模糊 */
    .card.highlight {
      transform: scale(1.08) translateY(-6px);
      border-color: var(--accent-color);
      box-shadow: 0 15px 35px var(--highlight-shadow), 0 0 20px var(--accent-color);
      opacity: 1 !important;
      filter: blur(0px) !important;
      z-index: 10;
    }

    /* 未被選中的卡片：降低透明度與加入微微模糊 */
    .card.dimmed {
      opacity: 0.45;
      filter: blur(1.5px);
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- 返回首頁按鈕 -->
  <a href="../index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> 返回冒險地圖
  </a>

  <header>
    <h1><i class="fa-solid fa-comment-dots text-pink-200"></i> Week 4 - 悄悄話留言板 <i class="fa-solid fa-comment-dots text-pink-200"></i></h1>
    <p>來自朋友與夥伴們最溫暖的點滴與祝福 ✨</p>
  </header>

  <div class="container">
    <!-- 讀取中酷炫動畫 -->
    <div id="loading">
      <div class="loader-heart"><i class="fa-solid fa-face-smile-beam"></i></div>
      <div class="loading-text">讀取悄悄話中... 💕</div>
    </div>

    <!-- 留言卡片瀑布流牆 -->
    <div id="wall" class="masonry-wall"></div>
  </div>

  <script>
    /* ==========================================
       6. JavaScript 資料處理與輪播邏輯
       ========================================== */

    // Google 試算表 CSV 發布網址
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQoiQOcoJPGytmTJ3MVzGvNtWhg9bUCQEQH998zeGBLOXSDZRPr27AYjFqGGtVtQ9F2QueQ5ordcG-7/pub?output=csv';

    // 輪播間隔時間（毫秒）—【可在這裡修改輪播速度】
    const CAROUSEL_INTERVAL = 3000; // 3000ms = 3秒

    let messageList = [];      // 儲存解析後的留言資料
    let cardElements = [];     // 儲存產生的 DOM 卡片物件
    let currentIndex = 0;      // 當前高亮的卡片索引
    let carouselTimer = null;  // 計時器變數

    // 頁面載入完成後執行資料串接
    window.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 從 Google 試算表抓取 CSV 內容
     */
    function fetchMessages() {
      fetch(csvUrl)
        .then(response => {
          if (!response.ok) throw new Error('網路回應異常');
          return response.text();
        })
        .then(csvText => {
          // 解析 CSV
          messageList = parseCSV(csvText);

          // 隱藏載入動畫，顯示留言牆
          document.getElementById('loading').style.display = 'none';
          const wall = document.getElementById('wall');
          wall.style.display = 'block';

          // 動態渲染卡片
          renderCards(messageList);

          // 如果有成功產生卡片，啟動輪播特效
          if (cardElements.length > 0) {
            startCarousel();
          }
        })
        .catch(error => {
          console.error('讀取留言失敗:', error);
          document.getElementById('loading').innerHTML = `
            <div style="color: #ffffff; text-align: center;">
              <i class="fa-solid fa-triangle-exclamation" style="font-size: 3.5rem;"></i>
              <p style="margin-top: 1rem; font-size: 1.1rem;">讀取悄悄話失敗了，請檢查網路或重新整理頁面喔！</p>
            </div>
          `;
        });
    }

    /**
     * 健全的 CSV 解析器（支援雙引號、內部包含逗號與換行的留言）
     */
    function parseCSV(text) {
      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentCell += '"';
            i++; // 跳過轉義引號
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentCell.trim());
          currentCell = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++;
          }
          currentRow.push(currentCell.trim());
          if (currentRow.length > 1 || currentRow[0] !== '') {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
        } else {
          currentCell += char;
        }
      }

      if (currentCell || currentRow.length > 0) {
        currentRow.push(currentCell.trim());
        rows.push(currentRow);
      }

      // 濾除標題列（如果第一列包含 "時間"）
      let dataRows = rows;
      if (rows.length > 0 && rows[0][0].includes('時間')) {
        dataRows = rows.slice(1);
      }

      // 轉換成物件格式：[0: 時間戳記, 1: 名字, 2: 留言內容]
      return dataRows.map(row => ({
        timestamp: row[0] || '未知時間',
        name: row[1] || '熱心的小夥伴',
        message: row[2] || '（這則悄悄話沒有留下文字內容～）'
      }));
    }

    /**
     * 動態生成卡片 HTML 並加入畫面中
     */
    function renderCards(data) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';
      cardElements = [];

      // 頭像循環使用的背景顏色清單
      const avatarColors = ['#ff9a9e', '#a18cd1', '#fbc2eb', '#fad0c4', '#ffb6c1', '#84fab0'];

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';

        // 取得名稱的第一個字作為頭像顯示
        const firstLetter = item.name.charAt(0).toUpperCase();
        const color = avatarColors[index % avatarColors.length];

        card.innerHTML = `
          <div class="card-header">
            <div class="avatar" style="background-color: ${color};">${firstLetter}</div>
            <div class="author-info">
              <span class="author-name">${escapeHTML(item.name)}</span>
              <span class="timestamp">${escapeHTML(item.timestamp)}</span>
            </div>
          </div>
          <div class="card-body">${escapeHTML(item.message)}</div>
        `;

        wall.appendChild(card);
        cardElements.push(card);
      });
    }

    /**
     * HTML 轉義防範 XSS 攻擊
     */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    /**
     * 啟動輪播計時器
     */
    function startCarousel() {
      highlightCard(currentIndex);

      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardElements.length;
        highlightCard(currentIndex);
      }, CAROUSEL_INTERVAL);
    }

    /**
     * 控制指定 index 的卡片亮起，其餘變暗
     */
    function highlightCard(targetIndex) {
      cardElements.forEach((card, idx) => {
        if (idx === targetIndex) {
          card.classList.add('highlight');
          card.classList.remove('dimmed');
          
          // 自動平滑滾動到當前高亮的卡片位置
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });
    }
  </script>
</body>
</html>
